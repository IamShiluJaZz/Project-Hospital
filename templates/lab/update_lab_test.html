{% extends 'lab/lab_lay.html' %}
{% load static %}

{% block content %}
<div class="pcoded-content">
    <div class="pcoded-inner-content">
        <div class="main-body">
            <div class="page-wrapper">
                <div class="container mt-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3>Update Lab Test</h3>
                        <a href="{% url 'lab_test_list' %}" class="btn btn-secondary">Back to List</a>
                    </div>

                    <div class="card shadow-lg p-4">
                        <form method="POST" enctype="multipart/form-data" id="labTestForm">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="test_name" class="form-label">Test Name</label>
                                <select class="form-select" id="test_name" name="test_name">
                                    {% for name in test_names %}
                                    <option value="{{ name.0 }}" {% if lab_test.test_name == name.0 %}selected{% endif %}>
                                        {{ name.1 }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="test_type" class="form-label">Test Type</label>
                                <select class="form-select" id="test_type" name="test_type">
                                    {% for type in test_types %}
                                    <option value="{{ type.0 }}" {% if lab_test.test_type == type.0 %}selected{% endif %}>
                                        {{ type.1 }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">Price</label>
                                <input type="number" class="form-control" id="price" name="price" value="{{ lab_test.price }}" 
                                    required step="0.01" min="0" inputmode="decimal" pattern="^\d+(\.\d{1,2})?$">
                                <small id="priceError" class="text-danger"></small>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3">{{ lab_test.description }}</textarea>
                            </div>

                            <div class="mb-3">
                                <label for="image" class="form-label">Upload Image</label>
                                <input type="file" class="form-control" id="image" name="image" accept="image/*" onchange="previewImage(event)">
                                <small id="imageError" class="text-danger"></small>
                                <div class="mt-2">
                                    {% if lab_test.image %}
                                        <img id="imagePreview" src="{{ lab_test.image.url }}" class="img-thumbnail" style="width: 100px; height: 100px;">
                                    {% else %}
                                        <img id="imagePreview" class="img-thumbnail" style="width: 100px; height: 100px; display: none;">
                                    {% endif %}
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success" id="submitButton" disabled>Update Test</button>
                        </form>

                        {% if messages %}
                        <div class="alert alert-danger">
                            <ul>
                                {% for message in messages %}
                                    <li>{{ message }}</li>
                                {% endfor %}
                            </ul>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript for Validation -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const priceInput = document.getElementById("price");
    const priceError = document.getElementById("priceError");
    const submitButton = document.getElementById("submitButton");

    function validatePrice() {
        const price = parseFloat(priceInput.value);
        if (isNaN(price) || price < 0) {
            priceError.textContent = "Price cannot be negative.";
            submitButton.disabled = true;
        } else {
            priceError.textContent = "";
            submitButton.disabled = false;
        }
    }

    priceInput.addEventListener("input", validatePrice);

    // Image Preview
    window.previewImage = function (event) {
        const imagePreview = document.getElementById("imagePreview");
        const file = event.target.files[0];
        if (file) {
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.style.display = "block";
        }
    };
});
</script>

{% endblock %}
