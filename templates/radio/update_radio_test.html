{% extends 'radio/radio_lay.html' %}
{% load static %}
{% block content %}

<div class="pcoded-content">
    <div class="pcoded-inner-content">
        <div class="main-body">
            <div class="page-wrapper">
                <div class="container mt-4">
                    <div class="card shadow-lg p-4">
                        <h3 class="text-center mb-4">Edit Radio Test</h3>

                        <form method="post" enctype="multipart/form-data" id="radioTestForm">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Test Name:</label>
                                <select name="test_name" class="form-select" required>
                                    <option value="">Select Test Name</option>
                                    {% for value, label in test_names %}
                                        <option value="{{ value }}" {% if radio_test.test_name == value %}selected{% endif %}>
                                            {{ label }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Test Type:</label>
                                <select name="test_type" class="form-select" required>
                                    <option value="">Select Test Type</option>
                                    {% for value, label in test_types %}
                                        <option value="{{ value }}" {% if radio_test.test_type == value %}selected{% endif %}>
                                            {{ label }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price:</label>
                                <input type="number" name="price" id="price" class="form-control" step="0.01" value="{{ radio_test.price }}" required>
                                <small class="text-danger d-none" id="price-error">Price must be a positive number greater than zero.</small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description:</label>
                                <textarea name="description" class="form-control" rows="3">{{ radio_test.description }}</textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-success" id="submit-btn">Update Test</button>
                                <a href="{% url 'radio_test_list' %}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('radioTestForm');
    const submitBtn = document.getElementById('submit-btn');
    const priceInput = document.getElementById('price');
    const priceError = document.getElementById('price-error');

    function validatePrice() {
        const price = parseFloat(priceInput.value);

        if (priceInput.value === "") {
            priceError.classList.add('d-none');
            submitBtn.disabled = true;
            return;
        }

        if (isNaN(price) || price <= 0) {
            priceError.classList.remove('d-none');
            submitBtn.disabled = true;
        } else {
            priceError.classList.add('d-none');
            submitBtn.disabled = false;
        }
    }

    // Validate on input
    priceInput.addEventListener('input', validatePrice);

    // Initial check
    validatePrice();
});
</script>

{% endblock %}
