{% extends 'ph/ph_lay.html' %}
{% block content %}
<div class="pcoded-content">
    <div class="pcoded-inner-content">
        <div class="main-body">
            <div class="page-wrapper">
                <div class="card">
                    <div class="card-header">
                        <h4>Add Medicine</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{% url 'add_medicine' %}">
                            {% csrf_token %}

                            <div class="form-group">
                                <label>Medicine Name</label>
                                <div class="input-group">
                                    <select class="form-control" name="medicine_name" id="medicine_name" required>
                                        <option value="">Select Medicine</option>
                                        {% for medicine in medicine_names %}
                                        <option value="{{ medicine.id }}">{{ medicine.medicine_name }}</option>
                                        {% endfor %}
                                    </select>
                                    <button type="button" class="btn btn-primary" onclick="openModal('medicine_name')">+</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Category</label>
                                <div class="input-group">
                                    <select class="form-control" name="category" id="category" required>
                                        <option value="">Select Category</option>
                                        {% for category in categories %}
                                        <option value="{{ category.id }}">{{ category.cat_name }}</option>
                                        {% endfor %}
                                    </select>
                                    <button type="button" class="btn btn-primary" onclick="openModal('cat_name')">+</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Supplier</label>
                                <div class="input-group">
                                    <select class="form-control" name="supplier" id="supplier" required>
                                        <option value="">Select Supplier</option>
                                        {% for supplier in suppliers %}
                                        <option value="{{ supplier.id }}">{{ supplier.supplier_name }}</option>
                                        {% endfor %}
                                    </select>
                                    <button type="button" class="btn btn-primary" onclick="openModal('supplier_name')">+</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Manufacture</label>
                                <div class="input-group">
                                    <select class="form-control" name="manufacture" id="manufacture" required>
                                        <option value="">Select Manufacture</option>
                                        {% for manufacture in manufactures %}
                                        <option value="{{ manufacture.id }}">{{ manufacture.manufature_name }}</option>
                                        {% endfor %}
                                    </select>
                                    <button type="button" class="btn btn-primary" onclick="openModal('manufacture_name')">+</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Batch No</label>
                                <input type="text" name="batch_no" id="batch_no" class="form-control" required>
                                <small id="batchNoValidation" style="color: red;"></small>
                            </div>
                            
                            

                            <div class="form-group">
                                <label>Quantity</label>
                                <input type="number" name="quantity" class="form-control" required min="1">
                            </div>

                            <div class="form-group">
                                <label>Expiry Date</label>
                                <input type="date" name="expiry_date" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label>Description</label>
                                <textarea name="description" class="form-control" required></textarea>
                            </div>

                            <div class="form-group">
                                <label>Price</label>
                                <input type="number"  name="price" class="form-control" min="1" required>
                            </div>

                            <button type="submit" class="btn btn-success">Save Medicine</button><br><br>
                            <a href="{% url 'medicine_list' %}" class="btn btn-primary">Medicine List</a>
                        </form>
                    </div>
                    

                </div>
            </div>
        </div>
    </div>
</div>

                <button type="button" class="btn btn-primary" onclick="saveNewItem()">Save</button>

            </div>
        </div>

let currentType;

function openModal(type) {
    currentType = type;
    document.getElementById("newItemName").value = "";
    document.getElementById("validationMessage").textContent = ""; // Clear previous messages
    $("#addNewModal").modal("show");
}

document.getElementById("newItemName").addEventListener("input", function () {
    let name = this.value.toLowerCase().replace(/\s+/g, ""); // Remove spaces and convert to lowercase
    if (!name) {
        document.getElementById("validationMessage").textContent = "";
        return;
    }

    let urlMap = {
        "medicine_name": "/add_medicine_name/",
        "cat_name": "/add_category/",
        "supplier_name": "/add_supplier/",
        "manufacture_name": "/add_manufacture/",
    };

    fetch(urlMap[currentType], {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams({ [currentType]: name, "check": "1" }), // Send normalized name
    })
        .then((response) => response.json().then((data) => ({ status: response.status, body: data })))
        .then(({ status, body }) => {
            let validationMsg = document.getElementById("validationMessage");
            if (status === 400) {
                validationMsg.textContent = body.error;
                validationMsg.style.color = "red";
            } else {
                validationMsg.textContent = "Name available!";
                validationMsg.style.color = "green";
            }
        })
        .catch((error) => console.error("Error:", error));
});


document.getElementById("batch_no").addEventListener("input", function() {
    let batchNo = this.value.trim();
    let validationMsg = document.getElementById("batchNoValidation");

    if (batchNo === "") {
        validationMsg.textContent = "";
        return;
    }

    fetch(`/check_batch_no/?batch_no=${batchNo}`)
        .then(response => response.json())
        .then(data => {
            if (data.exists) {
                validationMsg.textContent = "Batch No already exists!";
                validationMsg.style.color = "red";
            } else {
                validationMsg.textContent = "Batch No available!";
                validationMsg.style.color = "green";
            }
        })
        .catch(error => console.error("Error:", error));
});


document.querySelector("form").addEventListener("submit", function(event) {
    let validationMsg = document.getElementById("batchNoValidation").textContent;
    if (validationMsg.includes("already exists")) {
        event.preventDefault();
        alert("Please enter a unique Batch No.");
    }
});


document.addEventListener("DOMContentLoaded", function () {
    let expiryDateInput = document.querySelector("input[name='expiry_date']");
    
    // Set the min attribute to today's date to disable past dates
    let today = new Date().toISOString().split("T")[0];
    expiryDateInput.setAttribute("min", today);
});


function saveNewItem() {
    let name = document.getElementById("newItemName").value.trim();
    if (!name) return;

    let validationMsg = document.getElementById("validationMessage");
    if (validationMsg.textContent === "Name already exists") return; // Prevent saving

    let urlMap = {
        "medicine_name": "/add_medicine_name/",
        "cat_name": "/add_category/",
        "supplier_name": "/add_supplier/",
        "manufacture_name": "/add_manufacture/",
    };

    let selectMap = {
        "medicine_name": "medicine_name",
        "cat_name": "category",
        "supplier_name": "supplier",
        "manufacture_name": "manufacture",
    };

    fetch(urlMap[currentType], {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams({ [currentType]: name }),
    })
        .then((response) => response.json().then((data) => ({ status: response.status, body: data })))
        .then(({ status, body }) => {
            if (status === 400) {
                validationMsg.textContent = body.error;
                validationMsg.style.color = "red";
            } else {
                let select = document.getElementById(selectMap[currentType]);
                let option = new Option(body.name, body.id);
                select.add(option);
                select.value = body.id;
                $("#addNewModal").modal("hide");
            }
        })
        .catch((error) => console.error("Error:", error));
}


</script>
