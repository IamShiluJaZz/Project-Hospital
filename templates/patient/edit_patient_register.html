
{% extends 'patient/patient_layout.html' %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Edit Patient Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'admin/css/style.css' %}">
</head>
<body>
    <div class="container-scroller">
        <div class="container-fluid page-body-wrapper full-page-wrapper">
            <div class="content-wrapper d-flex align-items-center auth">
                <div class="row flex-grow">
                    <div class="col-lg-6 mx-auto">
                        <div class="auth-form-light text-left p-5">
                            <h4>Edit Patient Details</h4>
                            
                            <!-- You can remove Django messages display since errors come via JSON -->
                            
                            <form class="pt-3" method="POST" id="editPatientForm">
                                {% csrf_token %}
                                
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="patient_name">Full Name</label>
                                            <input type="text" class="form-control" id="patient_name" name="patient_name" value="{{ patient.fk_user.username }}" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="phone">Phone</label>
                                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ patient.fk_user.phone }}" required pattern="\d{10}">
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="emergency_contact">Emergency Contact</label>
                                            <input type="tel" class="form-control" id="emergency_contact" name="emergency_contact" value="{{ patient.emergency_contact }}" required pattern="\d{10}">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="email">Email</label>
                                            <input type="email" class="form-control" id="email" name="email" value="{{ patient.fk_user.email }}" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="gender">Gender</label>
                                            <select name="gender" class="form-control" required>
                                                <option value="">Select Gender</option>
                                                {% for gender_value, gender_label in gender_choices %}
                                                    <option value="{{ gender_value }}" {% if patient.gender == gender_value %}selected{% endif %}>{{ gender_label }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="address">Address</label>
                                            <input type="text" class="form-control" id="address" name="address" value="{{ patient.address }}" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-3 d-grid gap-2">
                                    <button class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn" type="submit">
                                        UPDATE DETAILS
                                    </button>
                                </div>
                            </form>

                            <br>
                            <div class="my-2 d-flex justify-content-between align-items-center">
                                <a href="{% url 'manage_patient_profile' %}" class="auth-link text-primary">Back</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Optionally, if you want to display messages from the server (if any) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags %}{{ message.tags }}{% else %}info{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {

        const form = document.getElementById("editPatientForm");
        const phone = document.getElementById("phone");
        const emergencyContact = document.getElementById("emergency_contact");
        const email = document.getElementById("email");

        // Regex for validation
        const phonePattern = /^\d{10}$/;
        const emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

        // Attach input validation event listeners
        phone.addEventListener("input", () => validateField(phone, phonePattern, "Phone number must be exactly 10 digits."));
        emergencyContact.addEventListener("input", () => validateField(emergencyContact, phonePattern, "Emergency contact must be exactly 10 digits."));
        email.addEventListener("input", () => validateField(email, emailPattern, "Email must be in 'name@gmail.com' format."));

        // Form submission event
        form.addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent default form submission

            // Perform final validation
            const isPhoneValid = validateField(phone, phonePattern, "Phone number must be exactly 10 digits.");
            const isEmergencyContactValid = validateField(emergencyContact, phonePattern, "Emergency contact must be exactly 10 digits.");
            const isEmailValid = validateField(email, emailPattern, "Email must be in 'name@gmail.com' format.");

            if (isPhoneValid && isEmergencyContactValid && isEmailValid) {
                let formData = new FormData(form);

                fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        alert(data.message);
                        window.location.href = data.redirect_url;
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("An error occurred. Please try again.");
                });
            }
        });

        // Validation function
        function validateField(input, regex, errorMessage) {
            const parent = input.parentNode;
            const existingError = parent.querySelector(".error-message");
            if (existingError) {
                existingError.remove();
            }
            if (!regex.test(input.value.trim())) {
                const errorDiv = document.createElement("div");
                errorDiv.className = "error-message text-danger mt-1";
                errorDiv.innerText = errorMessage;
                parent.appendChild(errorDiv);
                return false;
            }
            return true;
        }
    });
    </script>

    <script src="{% static 'admin/vendors/js/vendor.bundle.base.js' %}"></script>
    <script src="{% static 'admin/js/off-canvas.js' %}"></script>
</body>
</html>
{% endblock %}
