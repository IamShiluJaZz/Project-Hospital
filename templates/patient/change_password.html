{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>
    <link rel="stylesheet" href="{% static 'admin/css/style.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <!-- Font Awesome CSS for eye icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
          integrity="sha512-dC9l5u/5TjK5lK2yD31+Zw2WNVz/7nPqa0prkvF4EaY1GLFmd2ZoR0Gq6kH7eVUnMWyAXq6Ch5hcTjzwjK1+0A==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Positioning the toggle icon inside the input field */
        .position-relative .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg p-5 border-0 rounded-4 w-50 mx-auto">
            <h3 class="text-center mb-4 text-primary">Change Password</h3>
            
            {% if messages %}
                <div class="alert alert-danger">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" id="passwordChangeForm">
                {% csrf_token %}
                
                <!-- Old Password Field -->
                <div class="mb-3">
                    <label for="old_password" class="form-label">Old Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="#old_password"></i>
                    </div>
                </div>

                <!-- New Password Field -->
                <div class="mb-3">
                    <label for="new_password1" class="form-label">New Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control" id="new_password1" name="new_password1" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="#new_password1"></i>
                    </div>
                    <small id="passwordError" class="text-danger"></small>
                </div>

                <!-- Confirm New Password Field -->
                <div class="mb-3">
                    <label for="new_password2" class="form-label">Confirm New Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control" id="new_password2" name="new_password2" required>
                        <i class="fa-solid fa-eye toggle-password" data-target="#new_password2"></i>
                    </div>
                    <small id="confirmPasswordError" class="text-danger"></small>
                </div>

                <button type="submit" class="btn btn-primary w-100">Update Password</button>
            </form>
            <br>
            <div class="my-2 d-flex justify-content-between align-items-center">
                <a href="{% url 'manage_patient_profile' %}" class="auth-link text-primary">Back</a>
            </div>
        </div>
        <div><br></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Password Strength and Match Validation
            const passwordInput = document.getElementById("new_password1");
            const confirmPasswordInput = document.getElementById("new_password2");
            const passwordError = document.getElementById("passwordError");
            const confirmPasswordError = document.getElementById("confirmPasswordError");

            passwordInput.addEventListener("input", validatePasswordStrength);
            confirmPasswordInput.addEventListener("input", checkPasswordMatch);

            function validatePasswordStrength() {
                let password = passwordInput.value;
                let messages = [];

                if (password.length < 8) {
                    messages.push("At least 8 characters required.");
                }
                if (!/[A-Z]/.test(password)) {
                    messages.push("At least one uppercase letter.");
                }
                if (!/[0-9]/.test(password)) {
                    messages.push("At least one number.");
                }
                if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                    messages.push("At least one special character.");
                }
                passwordError.innerHTML = messages.length > 0 ? messages.join("<br>") : "";
            }

            function checkPasswordMatch() {
                if (passwordInput.value !== confirmPasswordInput.value) {
                    confirmPasswordError.textContent = "Passwords do not match!";
                } else {
                    confirmPasswordError.textContent = "";
                }
            }

            document.getElementById("passwordChangeForm").addEventListener("submit", function (event) {
                validatePasswordStrength();
                checkPasswordMatch();

                if (passwordError.textContent !== "" || confirmPasswordError.textContent !== "") {
                    event.preventDefault();
                }
            });

            // Toggle Password Visibility for All Password Fields
            const toggleIcons = document.querySelectorAll(".toggle-password");
            toggleIcons.forEach(function(icon) {
                icon.addEventListener("click", function() {
                    const targetInput = document.querySelector(this.getAttribute("data-target"));
                    if (targetInput.getAttribute("type") === "password") {
                        targetInput.setAttribute("type", "text");
                        this.classList.remove("fa-eye");
                        this.classList.add("fa-eye-slash");
                    } else {
                        targetInput.setAttribute("type", "password");
                        this.classList.remove("fa-eye-slash");
                        this.classList.add("fa-eye");
                    }
                });
            });
        });
    </script>
</body>
</html>
